name: Build

# Every push and pull request: compile and upload the exe as a workflow artifact.
# Publish a GitHub Release (or push a tag like v0.3.0): build with that version and
# attach ShakerRouter.exe to the release. The app's built-in updater reads the latest release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag, e.g. v0.3.0 (leave empty to just build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $tag = ''
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $tag = '${{ github.event.release.tag_name }}' }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = '${{ github.event.inputs.release_tag }}' }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }

          if ($tag) {
            $v = $tag.TrimStart('v', 'V')
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "args=-p:Version=$v" >> $env:GITHUB_OUTPUT
          } else {
            "tag=" >> $env:GITHUB_OUTPUT
            "args=" >> $env:GITHUB_OUTPUT
          }

      - name: Publish single-file exe
        shell: pwsh
        run: >
          dotnet publish ShakerRouter.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          ${{ steps.ver.outputs.args }}
          -o out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakerRouter-${{ github.sha }}
          path: out/ShakerRouter.exe

      - name: Attach exe to release
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag out/ShakerRouter.exe --clobber
          } else {
            gh release create $tag out/ShakerRouter.exe --target $env:GITHUB_SHA --title "Shaker Router $tag" --generate-notes
          }
